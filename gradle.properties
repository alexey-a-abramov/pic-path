# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Termux-only: AGP's bundled aapt2 expects glibc; Termux uses bionic. If you're
# building on Termux, add the override line below to ~/.gradle/gradle.properties
# (NOT to this file — it would break CI Linux runners that ship the right aapt2):
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
